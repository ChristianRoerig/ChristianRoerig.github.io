name: Sync Overleaf Slides

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:       # Manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      OVERLEAF_CREDS: ${{ secrets.OVERLEAF_EMAIL }}:${{ secrets.OVERLEAF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Clone Overleaf repos
        run: |
          git clone https://${OVERLEAF_CREDS}@git.overleaf.com/66a959ab6c58291a0258122d overleaf-data-science
          git clone https://${OVERLEAF_CREDS}@git.overleaf.com/PLACEHOLDER_ECONOMETRICS_ID overleaf-econometrics
          git clone https://${OVERLEAF_CREDS}@git.overleaf.com/PLACEHOLDER_APPLIED_MACRO_ID overleaf-applied-macro

      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y texlive-full latexmk

      - name: Build PDFs
        run: |
          compile_project() {
            local src_dir="$1"
            local out_dir="$2"
            local exclude_pattern="$3"

            mkdir -p "public/slides/${out_dir}"

            # Find directories with .tex files (exclude project/exam if specified)
            find "$src_dir" -maxdepth 1 -type d ! -name '.' | sort | while read -r dir; do
              folder=$(basename "$dir")

              if [ -n "$exclude_pattern" ] && echo "$folder" | grep -iqE "$exclude_pattern"; then
                echo "  Skipping $folder (excluded)"
                continue
              fi

              main_tex=$(find "$dir" -maxdepth 1 -name "*.tex" -print -quit)
              if [ -z "$main_tex" ]; then
                continue
              fi

              echo "=== Compiling ${out_dir}/${folder} ==="
              (cd "$dir" && latexmk -pdf -interaction=nonstopmode -halt-on-error "$(basename "$main_tex")") || {
                echo "  WARNING: Compilation failed, retrying without halt-on-error"
                (cd "$dir" && latexmk -pdf -interaction=nonstopmode "$(basename "$main_tex")") || true
              }

              pdf_file=$(find "$dir" -maxdepth 1 -name "*.pdf" -print -quit)
              if [ -n "$pdf_file" ]; then
                cp "$pdf_file" "public/slides/${out_dir}/${folder}.pdf"
                echo "  -> ${out_dir}/${folder}.pdf"
              fi
            done
          }

          compile_project "overleaf-data-science" "data-science" "project|exam"
          compile_project "overleaf-econometrics" "econometrics" ""
          compile_project "overleaf-applied-macro" "applied-macro" ""

      - name: Commit and push PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/slides/
          if git diff --cached --quiet; then
            echo "No changes to slides"
          else
            git commit -m "Update lecture slides from Overleaf"
            git push
          fi
